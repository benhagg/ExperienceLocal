<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience Local | Provo, Utah Field Guide</title>
  <meta name="description" content="A curated, fluff-free local guide to the best food, upcoming events, and outdoor experiences in Provo, Utah." />

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <!-- Google Fonts: Editorial Serif (Fraunces) + Modern Clean Body (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Masthead / Local Publication Header -->
  <header class="masthead">
    <div class="masthead-container">
      <div class="masthead-meta">
        <span class="masthead-tag"><i class="fa-solid fa-mountain-sun"></i> Utah Valley</span>
        <span class="masthead-date">Provo</span>
      </div>
      <h1 class="masthead-title">Experience Local Provo</h1>
      <p class="masthead-tagline">Experience Provo like a local</p>
    </div>
  </header>

  <!-- Sticky Nav Tabs -->
  <nav class="site-nav" aria-label="Main Navigation">
    <div class="nav-container">
      <button class="nav-tab active" data-tab="events">
        <i class="fa-regular fa-calendar-check"></i> Events
      </button>
      <button class="nav-tab" data-tab="food">
        <i class="fa-solid fa-utensils"></i> Food
      </button>
      <button class="nav-tab" data-tab="experiences">
        <i class="fa-solid fa-compass"></i> Experiences
      </button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="main-content">
    
    <!-- SECTION 1: EVENTS (Default) -->
    <section id="eventsSection" class="tab-panel active">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">What’s Happening in Town</h2>
        </div>
      </div>
      <div class="events-digest" id="eventsList">
        <!-- Injected via app.js -->
      </div>
    </section>

    <!-- SECTION 2: FOOD -->
    <section id="foodSection" class="tab-panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Where Locals Actually Eat</h2>
        </div>
      </div>
      <div id="foodList">
        <!-- Injected via app.js with varied editorial layouts -->
      </div>
    </section>

    <!-- SECTION 3: EXPERIENCES -->
    <section id="experiencesSection" class="tab-panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">Trails, Canyons & Culture</h2>
        </div>
      </div>
      <div class="field-guide-grid" id="experiencesList">
        <!-- Injected via app.js with landscape outdoor cards -->
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="footer-logo">Experience Local</span>
        <span class="footer-dot">•</span>
        <span>Provo, UT</span>
      </div>
      <p class="footer-note">Independent, hand-curated directory.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
